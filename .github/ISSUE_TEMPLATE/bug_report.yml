name: Bug report
description: Something is broken in the app
title: "[bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version (from Copy details)
      description: Paste the first line of Copy-details output, e.g. `rayik 0.1.0 (abc1234)`
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [WiFi, Mobile data, Both]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: What did you do?
      description: Exact taps, e.g. Search → type `gehra hua` → tap first result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead? (paste honest-error text + Copy details)
      description: Include the full error row text and the resolve/playback log lines
    validations:
      required: true
