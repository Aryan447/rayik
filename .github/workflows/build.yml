name: CI Build

on:
  pull_request:
  push:
    branches: [master, yuma-base]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate short SHA
        id: set-short-sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests (foss/mobile/universal)
        run: ./gradlew :app:testFossMobileUniversalDebugUnitTest

      - name: Assemble release APKs (foss/mobile/universal)
        run: ./gradlew assembleFossMobileUniversalRelease

      - name: Build release bundle (foss/mobile/universal)
        run: ./gradlew bundleFossMobileUniversalRelease

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: app-release-bundle-ci-${{ env.SHORT_SHA }}
          path: app/build/outputs/bundle/fossMobileUniversalRelease/*.aab
          if-no-files-found: warn

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk-ci-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/fossMobileUniversal/release/*.apk
          if-no-files-found: warn
