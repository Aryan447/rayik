name: Site Guard

# Mirrors Cloudflare Pages: installs with the same bun
# (site/.bun-version, currently `latest`) and builds the Astro site.
# Goes red exactly when a deploy would.

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Read pinned bun version
        id: bunver
        run: echo "v=$(cat site/.bun-version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bunver.outputs.v }}

      - name: Frozen install (fails on lockfile drift)
        run: bun install --frozen-lockfile
        working-directory: site

      - name: Build site
        run: bun run build
        working-directory: site
