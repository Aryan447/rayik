name: Site Guard

# Keeps Cloudflare Pages honest: the pinned bun (site/.bun-version)
# must read site/bun.lock, and the Astro site must build. If you
# upgrade local bun and this goes red, bump BUN_VERSION on the
# Cloudflare dashboard to match site/.bun-version and update that file.

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Read pinned bun version
        id: bunver
        run: echo "v=$(cat site/.bun-version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bunver.outputs.v }}

      - name: Frozen install (fails on lockfile drift)
        run: bun install --frozen-lockfile
        working-directory: site

      - name: Build site
        run: bun run build
        working-directory: site
